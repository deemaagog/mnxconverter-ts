name: Release
on:
  push:
    branches:
      - main

permissions:
  contents: write # semantic-release GitHub release + version commit
  issues: write # comment on released issues
  pull-requests: write # comment on released PRs
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Do not set registry-url — it writes an .npmrc that breaks OIDC auth
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm publish authenticates via OIDC trusted publishing — no NPM_TOKEN
        run: npx semantic-release
